<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>{{ post.title }}</title>
</head>
<body>
    <p><a href="{% url 'post_list' %}">목록으로</a></p>
    <h1>{{ post.title }}</h1>
    <p>작성자: {{ post.author }}</p>
    <p>작성일: {{ post.created_date }}</p>
    <p>게시일: {{ post.published_date }}</p>
    {% if post.image %}
        <img src="{{ post.image.url }}" alt="{{ post.title }}" style="max-width:400px;">
    {% endif %}
    <p>{{ post.text|linebreaks }}</p>
    <p><a href="{% url 'post_edit' pk=post.pk %}">수정</a></p>
</body>
</html>
